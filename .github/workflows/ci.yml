name: CI ve yayın

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Tip kontrolü
        run: npm run typecheck
      - name: Birim, denge ve determinizm testleri
        run: npm test
      - name: Edge paketi güncel mi
        run: |
          node scripts/build-edge.mjs
          git diff --exit-code supabase/functions/verify-day/game.js || (echo "verify-day/game.js eski: node scripts/build-edge.mjs çalıştırıp commit et" && exit 1)
      - name: Derleme
        run: npm run build
        env:
          VITE_APP_VERSION: ${{ github.sha }}
      - name: Uçtan uca test (Chromium)
        run: |
          npx playwright install --with-deps chromium
          npx vite preview --port 4173 &
          sleep 4
          node scripts/e2e.cjs doner
          node scripts/e2e.cjs kebap

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          VITE_APP_VERSION: ${{ github.sha }}
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4

  supabase:
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    needs: test
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Şema ve doğrulama fonksiyonu
        if: env.SUPABASE_ACCESS_TOKEN != '' && env.PROJECT_REF != ''
        run: |
          supabase link --project-ref "$PROJECT_REF"
          supabase db push
          supabase functions deploy verify-day --project-ref "$PROJECT_REF"

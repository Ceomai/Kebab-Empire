name: CI ve yayın

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Tip kontrolü
        run: npm run typecheck
      - name: Birim, denge ve determinizm testleri
        run: npm test
      - name: Edge paketi güncel mi
        run: |
          node scripts/build-edge.mjs
          git diff --exit-code supabase/functions/verify-day/game.js || (echo "verify-day/game.js eski: node scripts/build-edge.mjs çalıştırıp commit et" && exit 1)
      - name: Derleme
        run: npm run build
        env:
          VITE_APP_VERSION: ${{ github.sha }}
      - name: Uçtan uca test (Chromium)
        run: |
          npx playwright install --with-deps chromium
          npx vite preview --port 4173 &
          sleep 4
          node scripts/e2e.cjs doner
          node scripts/e2e.cjs kebap

  cross-browser:
    timeout-minutes: 45
    runs-on: ubuntu-latest
    needs: test
    strategy:
      fail-fast: false
      matrix:
        browser: [firefox, webkit]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Uçtan uca test (${{ matrix.browser }})
        env:
          BROWSER: ${{ matrix.browser }}
        run: |
          npx playwright install --with-deps ${{ matrix.browser }}
          npx vite preview --port 4173 &
          sleep 4
          node scripts/e2e.cjs doner
          node scripts/e2e.cjs kebap

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [test, cross-browser]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          VITE_APP_VERSION: ${{ github.sha }}
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
          VITE_TURNSTILE_SITEKEY: ${{ vars.VITE_TURNSTILE_SITEKEY }}
          VITE_CONTACT_EMAIL: ${{ vars.VITE_CONTACT_EMAIL }}
      # Derlenen siteyi gh-pages dalına yaz (Settings → Pages → Deploy from a branch → gh-pages / root)
      - name: gh-pages dalına yayınla
        run: |
          cd dist
          touch .nojekyll
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Yayın ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gh-pages

  ios:
    if: github.event_name != 'pull_request'
    needs: [test]
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      # kaynak eşlemeleri (.map) uygulama paketine girmesin
      - run: find dist -name '*.map' -delete && npx cap sync ios
      # İmzasız simülatör derlemesi: iOS projesinin derlendiğini doğrular (mağaza yüklemesi Apple hesabıyla Xcode'dan)
      - name: iOS derle (simülatör, imzasız)
        run: |
          set -o pipefail
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build | tail -n 40

  android:
    if: github.event_name != 'pull_request'
    needs: [test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm run build
        env:
          VITE_APP_VERSION: ${{ github.sha }}
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
          VITE_TURNSTILE_SITEKEY: ${{ vars.VITE_TURNSTILE_SITEKEY }}
          VITE_CONTACT_EMAIL: ${{ vars.VITE_CONTACT_EMAIL }}
      - run: find dist -name '*.map' -delete && npx cap sync android
      - name: APK derle
        run: |
          sed -i "s/versionCode 1$/versionCode ${{ github.run_number }}/; s/versionName \"1.0\"/versionName \"1.0.${{ github.run_number }}\"/" android/app/build.gradle
          cd android && chmod +x gradlew && ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../kebab-empire.apk
      # Google Play için imzalı AAB: anahtar deposu sırları tanımlıysa derlenir ve iş çıktısı olarak saklanır
      - name: Play paketi (AAB) derle
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KS_B64" ]; then
            echo "Anahtar deposu sırrı yok: imzasız AAB derlenerek sürüm yolu sınanıyor (imzalı paket için docs/MAGAZA.md)"
            cd android && ./gradlew bundleRelease --no-daemon && ls -la app/build/outputs/bundle/release/
            exit 0
          fi
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          export ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/upload.jks"
          cd android && ./gradlew bundleRelease --no-daemon
          cp app/build/outputs/bundle/release/app-release.aab ../kebab-empire.aab
      - uses: actions/upload-artifact@v4
        if: hashFiles('kebab-empire.aab') != ''
        with:
          name: kebab-empire-play-aab
          path: kebab-empire.aab
      # Sabit indirme adresi: /releases/download/android/kebab-empire.apk
      - name: APK'yı yayınla
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete android --yes --cleanup-tag || true
          gh release create android kebab-empire.apk --title "Kebab Empire Android (${GITHUB_SHA::7})" --notes "Son ana dal derlemesi. Telefonda indirip açın; bilinmeyen kaynaklardan yüklemeye izin vermeniz gerekebilir."

  supabase:
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    needs: test
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v5
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Şema ve doğrulama fonksiyonu
        if: env.SUPABASE_ACCESS_TOKEN != '' && env.PROJECT_REF != ''
        run: |
          supabase link --project-ref "$PROJECT_REF"
          supabase db push
          supabase functions deploy verify-day --project-ref "$PROJECT_REF"
